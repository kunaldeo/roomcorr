<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 112 1000 366" width="2400" height="878" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>roomcorr connection diagram</title>
  <style>
    .ink { stroke: #262626; stroke-width: 1.6; fill: none; }
    .dev { stroke: #262626; stroke-width: 1.6; fill: #ffffff; }
    .off { stroke: #bdbab2; stroke-width: 1.4; fill: #ffffff; }
    .lfe { stroke: #c92a2a; stroke-width: 2; fill: none; }
    .name { fill: #1d1d1d; font-size: 12.5px; font-weight: 700; letter-spacing: 0.6px; }
    .note { fill: #6f6d66; font-size: 11px; }
    .jack { fill: #1d1d1d; font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; }
    .jack-off { fill: #b3b0a8; font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; }
    .num { fill: #ffffff; font-size: 10.5px; font-weight: 700; }
  </style>

  <rect x="0.5" y="112.5" width="999" height="365" rx="12" fill="#fbfaf7" stroke="#e4e1d9"/>

  <!-- ===== desktop workstation: monitor + tower ===== -->
  <rect x="34" y="152" width="112" height="72" rx="4" class="dev"/>
  <rect x="42" y="160" width="96" height="56" rx="2" fill="none" stroke="#bdbab2" stroke-width="1.2"/>
  <text x="90" y="192" text-anchor="middle" fill="#6f6d66" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">roomcorr</text>
  <path d="M 84 224 V 238 M 96 224 V 238" class="ink"/>
  <path d="M 68 240 H 112" class="ink" stroke-width="2.4"/>
  <rect x="160" y="136" width="52" height="116" rx="4" class="dev"/>
  <path d="M 168 150 H 204 M 168 160 H 204" stroke="#bdbab2" stroke-width="1.2"/>
  <path d="M 172 176 H 200 M 172 184 H 200 M 172 192 H 200 M 172 200 H 200 M 172 208 H 200" stroke="#d8d5cd" stroke-width="1.2"/>
  <circle cx="186" cy="234" r="4.5" class="ink"/>
  <text x="112" y="274" text-anchor="middle" class="name">DESKTOP WORKSTATION</text>
  <text x="112" y="290" text-anchor="middle" class="note">Threadripper · Linux · PipeWire</text>

  <!-- USB to X4 -->
  <path d="M 212 196 H 280" class="ink"/>
  <text x="246" y="188" text-anchor="middle" class="note">USB</text>

  <!-- ===== Sound Blaster X4 (rear panel) ===== -->
  <rect x="280" y="140" width="250" height="150" rx="8" class="dev"/>
  <text x="298" y="166" class="name">SOUND BLASTER X4</text>
  <text x="298" y="182" class="note">rear panel · analog outputs</text>
  <!-- jacks -->
  <text x="494" y="208" text-anchor="end" class="jack">FRONT</text>
  <circle cx="510" cy="205" r="8" class="dev"/><circle cx="510" cy="205" r="2.6" fill="#262626"/>
  <text x="494" y="230" text-anchor="end" class="jack-off">REAR</text>
  <circle cx="510" cy="227" r="8" class="off"/>
  <text x="494" y="252" text-anchor="end" class="jack">C/SUB</text>
  <circle cx="510" cy="249" r="8" stroke="#c92a2a" stroke-width="1.8" fill="#ffffff"/><circle cx="510" cy="249" r="2.6" fill="#c92a2a"/>
  <text x="494" y="274" text-anchor="end" class="jack-off">SIDE</text>
  <circle cx="510" cy="271" r="8" class="off"/>

  <!-- ===== ① Front -> amp ===== -->
  <path d="M 518 205 H 640" class="ink"/>
  <circle cx="578" cy="205" r="9" fill="#262626"/><text x="578" y="209" text-anchor="middle" class="num">1</text>
  <text x="578" y="186" text-anchor="middle" class="note">3.5 mm → 2× RCA</text>

  <!-- ===== amplifier ===== -->
  <rect x="640" y="176" width="176" height="58" rx="5" class="dev"/>
  <circle cx="668" cy="205" r="13" class="ink"/>
  <circle cx="788" cy="205" r="13" class="ink"/>
  <path d="M 700 205 H 756" stroke="#bdbab2" stroke-width="1.2"/>
  <text x="728" y="256" text-anchor="middle" class="name">MARANTZ PM6003</text>
  <text x="728" y="272" text-anchor="middle" class="note">line input (CD) · any stereo amp</text>

  <!-- ===== ② amp -> speakers ===== -->
  <path d="M 816 196 H 862" class="ink"/>
  <path d="M 816 214 H 850 Q 856 214 856 220 V 300 Q 856 306 862 306 H 948 Q 954 306 954 300 V 246" class="ink"/>
  <circle cx="838" cy="306" r="9" fill="#262626"/><text x="838" y="310" text-anchor="middle" class="num">2</text>

  <!-- ===== speakers ===== -->
  <rect x="862" y="150" width="56" height="96" rx="4" class="dev"/>
  <circle cx="890" cy="172" r="7" class="ink"/><circle cx="890" cy="215" r="18" class="ink"/>
  <rect x="926" y="150" width="56" height="96" rx="4" class="dev"/>
  <circle cx="954" cy="172" r="7" class="ink"/><circle cx="954" cy="215" r="18" class="ink"/>
  <text x="890" y="140" text-anchor="middle" class="jack">L</text>
  <text x="954" y="140" text-anchor="middle" class="jack">R</text>
  <text x="922" y="330" text-anchor="middle" class="name">BOSTON A 26</text>
  <text x="922" y="346" text-anchor="middle" class="note">bookshelf pair</text>

  <!-- ===== ③ C/Sub -> subwoofer (red plug only) ===== -->
  <path d="M 518 249 H 566 Q 574 249 574 257 V 378 Q 574 386 582 386 H 640" class="lfe"/>
  <circle cx="574" cy="318" r="9" fill="#c92a2a"/><text x="574" y="322" text-anchor="middle" class="num">3</text>
  <text x="560" y="345" text-anchor="end" class="note">3.5 mm → 2× RCA</text>
  <text x="560" y="361" text-anchor="end" class="note"><tspan fill="#c92a2a" font-weight="700">red plug</tspan> → LFE in</text>
  <text x="560" y="377" text-anchor="end" class="note">white plug unused</text>
  <!-- the RCA plug at the sub -->
  <rect x="626" y="381" width="14" height="10" rx="2" fill="#c92a2a"/>

  <!-- ===== subwoofer ===== -->
  <rect x="640" y="330" width="120" height="112" rx="6" class="dev"/>
  <circle cx="700" cy="386" r="38" class="ink"/>
  <circle cx="700" cy="386" r="12" class="ink"/>
  <text x="776" y="372" class="name">POLK HTS 10</text>
  <text x="776" y="388" class="note">powered subwoofer · LFE in</text>
  <text x="776" y="404" class="note">low-pass at max, phase 0°</text>

  <!-- ===== ④ UMIK-1 (calibration only) ===== -->
  <path d="M 58 414 H 226 Q 234 414 234 406 V 238 Q 234 230 226 230 H 212" class="ink" stroke-dasharray="4 4"/>
  <circle cx="234" cy="318" r="9" fill="#262626"/><text x="234" y="322" text-anchor="middle" class="num">4</text>
  <circle cx="52" cy="352" r="5" class="dev"/>
  <rect x="46" y="358" width="12" height="74" rx="4" class="dev"/>
  <text x="74" y="370" class="name">MINIDSP UMIK-1</text>
  <text x="74" y="386" class="note">USB · only while calibrating</text>

  <!-- footnote -->
  <text x="32" y="464" class="note">Rear and Side outputs are unused. roomcorr does the crossover, sub delay and polarity; the sub's own low-pass stays at maximum.</text>
</svg>
